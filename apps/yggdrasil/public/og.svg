<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- favicon 的仿射复刻(x*1.875+90, y*1.875+125):zinc 侧身 + emerald 顶面
       + 方波锯齿草沿披挂 + 垂下的根系电路 -->
  <g>
    <polygon points="180,290 330,365 330,515 180,440" fill="#27272a"/>
    <polygon points="330,365 480,290 480,440 330,515" fill="#18181b"/>

    <polygon points="180,290 330,365 330,395 300,380 300,410 270,395 270,365 240,350 240,395 210,380 210,350 180,335" fill="#059669"/>
    <polygon points="330,365 480,290 480,335 450,350 450,380 420,365 420,350 390,365 390,395 360,410 360,380 330,395" fill="#047857"/>

    <path d="M 330 215 L 480 290 L 330 365 L 180 290 Z" fill="#10b981"/>
    <path d="M 330 230 L 465 290 L 330 350 L 195 290" fill="none" stroke="#34d399" stroke-width="3" opacity="0.6"/>
    <path d="M 180 290 L 330 365 L 480 290" fill="none" stroke="#34d399" stroke-width="3" opacity="0.8"/>

    <g stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M 210 380 L 210 425 L 240 440 L 240 470"/>
      <path d="M 270 395 L 270 425 L 300 440 L 300 500"/>
      <path d="M 360 410 L 360 470 L 390 455 L 390 485"/>
      <path d="M 420 395 L 420 425 L 450 410 L 450 455"/>
    </g>

    <g transform="translate(330,290) scale(2,1)">
      <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="#d1fae5" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <rect x="120" y="120" width="10" height="10" fill="#a7f3d0"/>
    <rect x="1050" y="90" width="8" height="8" fill="#34d399"/>
    <rect x="1090" y="500" width="10" height="10" fill="#6ee7b7"/>
    <rect x="80" y="470" width="8" height="8" fill="#10b981"/>
    <rect x="560" y="120" width="8" height="8" fill="#10b981"/>
    <rect x="980" y="560" width="6" height="6" fill="#10b981"/>
  </g>

  <text x="620" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="700" letter-spacing="-1" fill="#fafafa">AsterYggdrasil</text>
  <text x="622" y="352" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" fill="#34d399">Minecraft auth &amp; skins, self-hosted.</text>
</svg>
